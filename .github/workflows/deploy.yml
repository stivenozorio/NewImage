name: Deploy New Image Construction & Remodeling

# Publica la rama `main` en newimageremodeling.co en cada push. Sitio
# estático (HTML/CSS/JS, sin build step): se sube tal cual por FTPS a la
# raíz del dominio en el hosting (dominio principal de esa cuenta →
# "public_html/").
#
# Requisitos (ya configurados por el usuario):
#   - Secrets del repo (Settings → Secrets and variables → Actions):
#       FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-newimage
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar el sitio antes de publicar
        run: |
          set -euo pipefail
          for f in index.html services/index.html work/index.html about/index.html contact/index.html css/styles.css js/main.js; do
            test -f "$f" || { echo "::error::falta $f"; exit 1; }
          done
          grep -q "info@newimageremodeling.co" index.html \
            || { echo "::error::falta el email correcto en index.html"; exit 1; }
          echo "Validación OK: $(find . -type f -not -path './.git/*' | wc -l) archivos."

      - name: Preparar solo los archivos del sitio (sin .git ni .github)
        run: |
          set -euo pipefail
          mkdir -p _site
          git ls-files | grep -vE '^(\.github|tools)/' | tar -cf - -T - | tar -xf - -C _site
          echo "Preparados: $(find _site -type f | wc -l) archivos."
          test ! -e _site/.git
          test ! -e _site/.github
          test ! -e _site/tools

      # El .htaccess cachea CSS y JS un mes. Si el HTML cambia de estructura
      # y el ?v= no, el navegador mezcla HTML nuevo con CSS/JS viejos y la
      # pagina se rompe. Sellar con el SHA hace que cada deploy tenga una
      # clave de cache propia, asi HTML y assets nunca se desincronizan.
      - name: Sellar los assets con el SHA del commit
        run: |
          set -euo pipefail
          STAMP="${GITHUB_SHA::12}"
          mapfile -t PAGES < <(find _site -name '*.html')
          test "${#PAGES[@]}" -gt 0
          sed -i -E "s#(/css/styles\.css|/js/main\.js)\?v=[^\"']*#\1?v=${STAMP}#g" "${PAGES[@]}"
          # Ninguna pagina puede quedar sin sellar.
          for f in "${PAGES[@]}"; do
            grep -qF "styles.css?v=${STAMP}" "$f" || { echo "::error::sin sellar: $f"; exit 1; }
            grep -qF "main.js?v=${STAMP}" "$f" || { echo "::error::sin sellar: $f"; exit 1; }
          done
          echo "Sellado con ?v=${STAMP}: ${#PAGES[@]} paginas."

      - name: Publicar por FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ vars.FTP_TARGET_DIR || '.' }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_SERVER}" ] || [ -z "${FTP_USERNAME}" ] || [ -z "${FTP_PASSWORD}" ]; then
            echo "::error::Faltan los secrets FTP_SERVER / FTP_USERNAME / FTP_PASSWORD en este repositorio (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          for attempt in 1 2 3; do
            if lftp -u "${FTP_USERNAME},${FTP_PASSWORD}" \
              -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set net:timeout 20; set net:max-retries 2; set net:reconnect-interval-base 5; set cmd:fail-exit no; mirror -R --verbose _site/ ${FTP_TARGET_DIR}; cd ${FTP_TARGET_DIR}; rm -rf .git; rm -rf .github; set cmd:fail-exit yes; bye" \
              "${FTP_SERVER}"; then
              exit 0
            fi
            echo "Intento ${attempt} falló, reintentando en 10s..."
            sleep 10
          done
          exit 1

      - name: Verificar el sitio en vivo
        run: |
          set -uo pipefail
          sleep 45
          conectado=false
          for attempt in 1 2 3 4 5; do
            if curl -sSf --connect-timeout 20 --max-time 40 https://newimageremodeling.co/ -o page.html; then
              conectado=true
              break
            fi
            echo "Intento ${attempt}: no se pudo conectar; reintento en 30s..."
            sleep 30
          done

          if [ "${conectado}" != true ]; then
            echo "::warning::No se pudo conectar con newimageremodeling.co desde el runner tras 5 intentos. La subida terminó bien; queda sin comprobar si el sitio en vivo ya refleja este despliegue."
            exit 0
          fi

          if grep -qiE "please wait while your request is being verified|one moment, please" page.html; then
            echo "::warning::El hosting mostró una pantalla de espera/anti-bot en vez del sitio real. Esto NO significa que el deploy haya fallado — verificá manualmente en un navegador si tenés dudas."
            exit 0
          fi

          grep -q "From Concept" page.html \
            || { echo "::error::newimageremodeling.co no refleja este despliegue"; head -c 2000 page.html; exit 1; }

          # El HTML en vivo tiene que apuntar al CSS/JS de ESTE commit. Si no,
          # los visitantes mezclan HTML nuevo con assets cacheados viejos.
          STAMP="${GITHUB_SHA::12}"
          if grep -q "styles.css?v=${STAMP}" page.html; then
            echo "Assets sellados correctamente con ?v=${STAMP}."
          else
            echo "::error::El HTML en vivo no referencia los assets de este commit (?v=${STAMP})."
            grep -o -E '(styles\.css|main\.js)\?v=[^"]*' page.html | sort -u
            exit 1
          fi

          # El hero ya no es un <video> escaneado por scroll (esa técnica
          # dependía de range requests sobre el mp4) sino una secuencia de
          # imágenes dibujadas en un <canvas>; el mp4 de closets sigue
          # siendo un <video> con controles nativos, y ese sí depende de
          # range requests para arrancar/scrubbear bien.
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -r 0-99 \
            --connect-timeout 20 --max-time 40 \
            https://newimageremodeling.co/assets/video/closet-walkthrough-1.mp4 || echo "000")
          if [ "${codigo}" = "206" ]; then
            echo "El hosting responde peticiones por rango (206) en los mp4."
          else
            echo "::warning::El mp4 devolvio ${codigo} en vez de 206 para una peticion por rango. Si el video de closets no arranca bien, la causa es esta."
          fi

          # El hero depende de que la primera imagen de la secuencia esté
          # publicada; sin ella el hero se queda en el poster estático.
          codigo=$(curl -s -o /dev/null -w '%{http_code}' \
            --connect-timeout 20 --max-time 40 \
            https://newimageremodeling.co/assets/hero-frames/f001.webp || echo "000")
          if [ "${codigo}" = "200" ]; then
            echo "La primera imagen del hero está publicada."
          else
            echo "::error::assets/hero-frames/f001.webp devolvió ${codigo} en vez de 200."
            exit 1
          fi

          echo "Confirmado: newimageremodeling.co refleja este despliegue."
